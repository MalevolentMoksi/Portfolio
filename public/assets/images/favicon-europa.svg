<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <filter id="glow" color-interpolation-filters="sRGB" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" in="SourceGraphic" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .bg{fill:#040a0f}.ring{fill:none;stroke:#00e5ff;stroke-width:1.2;opacity:.45}.e-halo{fill:#7dd3fc;opacity:.35}.e-core{fill:#00e5ff}.c-halo{fill:#7dd3fc;opacity:.3}.c-core{fill:#7dd3fc}
  </style>
  <circle cx="32" cy="32" r="30" class="bg"/>
  <circle cx="32" cy="32" r="24" class="ring"/>
  <circle cx="32" cy="32" r="14" class="ring"/>
  <circle cx="50.8" cy="27.4" r="6" class="e-halo" filter="url(#glow)"/>
  <circle cx="50.8" cy="27.4" r="3.5" class="e-core"/>
  <circle cx="13.2" cy="36.8" r="5" class="e-halo" filter="url(#glow)"/>
  <circle cx="13.2" cy="36.8" r="3" class="e-core"/>
  <circle cx="37.7" cy="54.2" r="4" class="e-halo" opacity=".15"/>
  <circle cx="37.7" cy="54.2" r="2" class="e-core" opacity=".45"/>
  <circle cx="26.4" cy="10.5" r="5" class="e-halo" filter="url(#glow)"/>
  <circle cx="26.4" cy="10.5" r="3" class="e-core"/>
  <circle cx="32" cy="32" r="8" class="c-halo" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="4.5" class="c-core"/>
</svg>