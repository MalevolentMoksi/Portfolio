<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <filter id="glow" color-interpolation-filters="sRGB" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" in="SourceGraphic" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .bg{fill:#0d0808}.ring{fill:none;stroke:#ff5722;stroke-width:1.2;opacity:.45}.e-halo{fill:#ffd600;opacity:.35}.e-core{fill:#ff5722}.c-halo{fill:#ffd600;opacity:.3}.c-core{fill:#ffd600}
  </style>
  <circle cx="32" cy="32" r="30" class="bg"/>
  <circle cx="32" cy="32" r="24" class="ring"/>
  <circle cx="32" cy="32" r="14" class="ring"/>
  <circle cx="42.7" cy="7.6" r="6" class="e-halo" filter="url(#glow)"/>
  <circle cx="42.7" cy="7.6" r="3.5" class="e-core"/>
  <circle cx="57.1" cy="18.9" r="5" class="e-halo" filter="url(#glow)"/>
  <circle cx="57.1" cy="18.9" r="3" class="e-core"/>
  <circle cx="22.3" cy="56.9" r="4" class="e-halo" opacity=".15"/>
  <circle cx="22.3" cy="56.9" r="2" class="e-core" opacity=".45"/>
  <circle cx="8.4" cy="44.8" r="5" class="e-halo" filter="url(#glow)"/>
  <circle cx="8.4" cy="44.8" r="3" class="e-core"/>
  <circle cx="32" cy="32" r="8" class="c-halo" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="4.5" class="c-core"/>
</svg>