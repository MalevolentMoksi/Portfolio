<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <filter id="glow" color-interpolation-filters="sRGB" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" in="SourceGraphic" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .bg{fill:#06000d}.ring{fill:none;stroke:#ff71ce;stroke-width:1.2;opacity:.45}.e-halo{fill:#b0e0ff;opacity:.35}.e-core{fill:#ff71ce}.c-halo{fill:#b0e0ff;opacity:.3}.c-core{fill:#b0e0ff}
  </style>
  <circle cx="32" cy="32" r="30" class="bg"/>
  <circle cx="32" cy="32" r="24" class="ring"/>
  <circle cx="32" cy="32" r="14" class="ring"/>
  <circle cx="36.1" cy="9.1" r="6" class="e-halo" filter="url(#glow)"/>
  <circle cx="36.1" cy="9.1" r="3.5" class="e-core"/>
  <circle cx="54.7" cy="20.8" r="5" class="e-halo" filter="url(#glow)"/>
  <circle cx="54.7" cy="20.8" r="3" class="e-core"/>
  <circle cx="30.4" cy="55.8" r="4" class="e-halo" opacity=".15"/>
  <circle cx="30.4" cy="55.8" r="2" class="e-core" opacity=".45"/>
  <circle cx="10.1" cy="43.4" r="5" class="e-halo" filter="url(#glow)"/>
  <circle cx="10.1" cy="43.4" r="3" class="e-core"/>
  <circle cx="32" cy="32" r="8" class="c-halo" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="4.5" class="c-core"/>
</svg>
