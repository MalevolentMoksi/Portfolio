<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <filter id="glow" color-interpolation-filters="sRGB" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" in="SourceGraphic" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .bg{fill:#080600}.ring{fill:none;stroke:#d4af37;stroke-width:1.2;opacity:.45}.e-halo{fill:#ffe17e;opacity:.35}.e-core{fill:#d4af37}.c-halo{fill:#ffe17e;opacity:.3}.c-core{fill:#ffe17e}
  </style>
  <circle cx="32" cy="32" r="30" class="bg"/>
  <circle cx="32" cy="32" r="24" class="ring"/>
  <circle cx="32" cy="32" r="14" class="ring"/>
  <circle cx="47.4" cy="15.2" r="6" class="e-halo" filter="url(#glow)"/>
  <circle cx="47.4" cy="15.2" r="3.5" class="e-core"/>
  <circle cx="16.5" cy="46.8" r="5" class="e-halo" filter="url(#glow)"/>
  <circle cx="16.5" cy="46.8" r="3" class="e-core"/>
  <circle cx="41.8" cy="50.1" r="4" class="e-halo" opacity=".15"/>
  <circle cx="41.8" cy="50.1" r="2" class="e-core" opacity=".45"/>
  <circle cx="32" cy="32" r="8" class="c-halo" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="4.5" class="c-core"/>
</svg>