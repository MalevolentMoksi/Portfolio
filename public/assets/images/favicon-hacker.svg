<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <filter id="glow" color-interpolation-filters="sRGB" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" in="SourceGraphic" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .bg{fill:#010801}.ring{fill:none;stroke:#00ff41;stroke-width:1.2;opacity:.45}.e-halo{fill:#b3ffbe;opacity:.35}.e-core{fill:#00ff41}.c-halo{fill:#b3ffbe;opacity:.3}.c-core{fill:#b3ffbe}
  </style>
  <circle cx="32" cy="32" r="30" class="bg"/>
  <circle cx="32" cy="32" r="24" class="ring"/>
  <circle cx="32" cy="32" r="14" class="ring"/>
  <circle cx="45.8" cy="10.2" r="6" class="e-halo" filter="url(#glow)"/>
  <circle cx="45.8" cy="10.2" r="3.5" class="e-core"/>
  <circle cx="18.6" cy="55.1" r="4" class="e-halo" opacity=".15"/>
  <circle cx="18.6" cy="55.1" r="2" class="e-core" opacity=".45"/>
  <circle cx="53.2" cy="41.4" r="5" class="e-halo" filter="url(#glow)"/>
  <circle cx="53.2" cy="41.4" r="3" class="e-core"/>
  <circle cx="32" cy="32" r="8" class="c-halo" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="4.5" class="c-core"/>
</svg>