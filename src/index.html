<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="%BASE_URL%assets/images/favicon.svg" type="image/svg+xml" />

    <!-- Preload images for high-traffic routes — élimine le délai de chargement au premier accès -->
    <link
      rel="preload"
      as="image"
      href="/assets/images/backgrounds/risk-of-rain-2-launch-update.webp"
      type="image/webp"
      fetchpriority="high"
    />

    <!-- Preconnect aux domaines CDN pour éliminer le coût DNS+TCP+TLS au premier accès -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />

    <title>Portfolio - Enzo Morello</title>
    <meta
      name="description"
      content="Portfolio d'Enzo Morello, étudiant en BUT Informatique à l'IUT2 de Grenoble"
    />

    <!-- Open Graph / Social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://moksi.studio/" />
    <meta property="og:title" content="Portfolio - Enzo Morello" />
    <meta
      property="og:description"
      content="Portfolio d'Enzo Morello, étudiant en BUT Informatique à l'IUT2 de Grenoble."
    />
    <meta
      property="og:image"
      content="https://moksi.studio/assets/images/backgrounds/risk-of-rain-2-launch-update.webp"
    />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Portfolio - Enzo Morello" />
    <meta
      name="twitter:description"
      content="Portfolio d'Enzo Morello, étudiant en BUT Informatique à l'IUT2 de Grenoble."
    />
    <meta
      name="twitter:image"
      content="https://moksi.studio/assets/images/backgrounds/risk-of-rain-2-launch-update.webp"
    />
  </head>
  <body>
    <div id="root"></div>
    <div id="ambient-root"></div>

    <!-- External libraries -->
    <!-- particles.js — only injected on high-performance devices to avoid jank on low-end/mobile -->
    <script>
      (function () {
        var cores = navigator.hardwareConcurrency || 0;
        var reduced =
          window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        // Skip particles on touch/mobile devices — canvas particle systems are a battery/GPU drain
        // and mouse-based interactivity (grab, push) is irrelevant on touchscreens.
        var isMobile =
          window.matchMedia && window.matchMedia('(hover: none) and (pointer: coarse)').matches;
        if (!reduced && !isMobile && cores >= 4) {
          var s = document.createElement('script');
          s.src = 'https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js';
          document.head.appendChild(s);
        }
      })();
    </script>

    <!-- Service Worker registration — deferred to avoid render blocking -->
    <script defer src="%BASE_URL%registerSW.js"></script>

    <!-- Main application script -->
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
