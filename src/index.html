<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="%BASE_URL%assets/images/favicon.svg" type="image/svg+xml" />

    <!-- Preload images for high-traffic routes — élimine le délai de chargement au premier accès -->
    <link
      rel="preload"
      as="image"
      href="/assets/images/backgrounds/risk-of-rain-2-launch-update.jpg"
      type="image/jpeg"
      fetchpriority="high"
    />

    <!-- Preconnect aux domaines CDN pour éliminer le coût DNS+TCP+TLS au premier accès -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com" />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />

    <!-- Google Fonts — loaded in HTML to parallelize with CSS parsing (not blocking) -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap"
    />

    <!-- Font Awesome — chargement non-bloquant (media swap trick) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      media="print"
      onload="this.media = 'all'"
    />
    <!-- Fallback si JS désactivé -->
    <noscript>
      <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      />
    </noscript>

    <title>Portfolio - Enzo Morello</title>
    <meta
      name="description"
      content="Portfolio d'Enzo Morello, étudiant en BUT Informatique à l'IUT2 de Grenoble"
    />
  </head>
  <body>
    <div id="root"></div>
    <div id="ambient-root"></div>

    <!-- External libraries -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js" defer></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"
      defer
    ></script>

    <!-- Service Worker registration — deferred to avoid render blocking -->
    <script defer src="%BASE_URL%registerSW.js"></script>

    <!-- Main application script -->
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
