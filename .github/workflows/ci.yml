name: CI

# Gates pull requests (and non-main branches) on typecheck + unit/integration tests
# + build, so coverage and the test suite actually run before code reaches main.
# (Pushes to main are covered by the Deploy workflow, which now also runs tests.)
on:
  pull_request:
    branches: ["main"]
  push:
    branches-ignore: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit & integration tests (with coverage thresholds)
        run: npm run test:coverage

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    # Non-blocking for now: the e2e specs are still being hardened, so surface results
    # without blocking merges. Promote to a required check once they're stabilized.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: e2e tests (chromium)
        run: npx playwright test --project=chromium
